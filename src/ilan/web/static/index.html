<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the layout reach under the notch and home
     indicator; app.css pays that back with env(safe-area-inset-*) padding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ilan">
<title>ilan</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignores an SVG apple-touch-icon and falls back to a page screenshot,
     so the home-screen icon has to be a PNG. 180x180 is the size iOS asks for
     at 3x; it downscales that for the tab icon too. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png" type="image/png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Icon definitions for the card's actions, drawn once and referenced by
     <use> from every card. Inlining them per button instead would repeat the
     path data three times for every task in the list.

     Each shape is a handful of coordinates, which is why they are drawn here
     rather than pulled from an icon set: the app ships no dependencies, and
     three of these are not a reason to start. Stroke and size come from the
     stylesheet, so a symbol carries geometry only. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <!-- A paper plane: Tap sends a canned message, so the mark says "sent". -->
  <symbol id="i-send" viewBox="0 0 24 24">
    <path d="M3 11.5 21 3.5 13.5 21 11 13z"/><path d="M11 13 21 3.5"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5.5 15.5 12 9 18.5"/></symbol>
  <!-- An arrow turning back on itself: reopening a closed task. -->
  <symbol id="i-undo" viewBox="0 0 24 24">
    <path d="M3.5 9.5 8 5"/><path d="M3.5 9.5 8 14"/>
    <path d="M3.5 9.5H14.5a5.5 5.5 0 0 1 0 11H10"/>
  </symbol>
</svg>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<!-- markdown.js first: app.js takes its escape helper from it at load time. -->
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
