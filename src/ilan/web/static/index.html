<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the layout reach under the notch and home
     indicator; app.css pays that back with env(safe-area-inset-*) padding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ilan">
<title>ilan</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignores an SVG apple-touch-icon and falls back to a page screenshot,
     so the home-screen icon has to be a PNG. 180x180 is the size iOS asks for
     at 3x; it downscales that for the tab icon too. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png" type="image/png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
