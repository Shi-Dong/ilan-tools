<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The app's icon: the same portrait as before, redrawn in a few flat
       shapes and strokes so it still reads at tab size, where the shaded
       original turned to mush. Drawn as shapes rather than traced, so it
       rasterises identically wherever it is rendered. Full-bleed and opaque
       on purpose: iOS paints the transparent corners of a home-screen icon
       black and rounds the corners itself, and the header logo rounds them
       in CSS. icon-512.png and icon-180.png are renders of this file
       (headless Chrome at 512, downscaled to 180); edit this, then
       re-render, rather than editing the pixels. -->
  <defs>
    <!-- The head: a wide crown tapering to the chin. -->
    <path id="head" d="M256 64 C340 64 404 140 404 222 C404 320 338 392 256 392 C174 392 108 320 108 222 C108 140 172 64 256 64 Z"/>
    <clipPath id="face"><use href="#head"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#a9dccb"/>
  <!-- jacket, shoulders -->
  <path d="M24 512 C24 440 120 404 256 404 C392 404 488 440 488 512 Z" fill="#8e9098"/>
  <!-- the white tee showing at the open front -->
  <path d="M196 404 L256 496 L316 404 Z" fill="#ffffff"/>
  <!-- lanyard -->
  <g fill="none" stroke="#f28c2a" stroke-width="9" stroke-linecap="round">
    <path d="M236 410 L247 488"/><path d="M276 410 L265 488"/>
  </g>
  <!-- neck, ears, head -->
  <rect x="228" y="340" width="56" height="80" rx="16" fill="#f2c7a2"/>
  <ellipse cx="104" cy="238" rx="17" ry="28" fill="#f2c7a2"/>
  <ellipse cx="408" cy="238" rx="17" ry="28" fill="#f2c7a2"/>
  <use href="#head" fill="#f2c7a2"/>
  <!-- the beard shadow: from the sideburns down to the corners of the mouth
       and back up under the nose, a shade darker than the skin -->
  <path d="M108 236 Q160 250 200 300 Q256 272 312 300 Q352 250 404 236 L404 400 L108 400 Z" fill="#e3b493" clip-path="url(#face)"/>
  <!-- brows, eyes, nose, smile -->
  <g fill="none" stroke="#3a2b24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 206 Q210 190 240 200" stroke-width="14"/>
    <path d="M272 200 Q302 190 332 206" stroke-width="14"/>
    <path d="M262 244 Q250 274 270 282" stroke-width="10"/>
    <path d="M208 304 Q256 346 304 304" stroke-width="12"/>
  </g>
  <circle cx="208" cy="236" r="12" fill="#3a2b24"/>
  <circle cx="304" cy="236" r="12" fill="#3a2b24"/>
</svg>
