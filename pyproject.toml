[project]
name = "ilan-cli"
version = "0.1.0"
description = "Manage and run a swarm of Claude Code agents on user-defined tasks"
requires-python = ">=3.11"
dependencies = [
    # Click 8.4.x ships a broken fish shell-completion script (its _SOURCE_FISH
    # template is a non-raw string, so the intended `\n`/`\t` escapes collapse
    # into literal control chars, breaking `string split` under fish 4.x). Pin
    # below 8.4 until the upstream template is fixed.
    "click>=8.1,<8.4",
    "rich>=13.0",
    # Web Push to phones that installed the web app: VAPID signing and the
    # RFC 8291 payload encryption, which are not worth hand-rolling.
    "pywebpush>=2.0",
    # The default time zone is US/Pacific, a legacy alias that some systems'
    # zoneinfo no longer ship (e.g. newer Ubuntu without tzdata-legacy). The
    # bundled database keeps every alias, so ZoneInfo never depends on the OS.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
ilan = "ilan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
